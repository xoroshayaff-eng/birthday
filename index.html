<style>
:root{
  --pink:#ee9fc4;
  --pink-deep:#c9568f;
  --pink-soft:#f6c9de;
  --pink-pale:#fbe7f0;
  --ink:#2b2327;
  --paper:#fdfbfc;
  --hand:'Caveat','Segoe Script','Bradley Hand','Comic Sans MS',cursive;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--hand);
  font-size:1.35rem;
  line-height:1.35;
  color:var(--ink);
  background:#efe4ea;
  -webkit-font-smoothing:antialiased;
}
/* бумажная колонка */
.sheet{
  max-width:540px;
  margin:0 auto;
  background-color:var(--paper);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .35  0 0 0 0 .4  0 0 0 .07 0'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>");
  border-left:1px solid #cfc3c9;
  border-right:1px solid #cfc3c9;
  min-height:100vh;
  padding:0 0 3rem;
  overflow:hidden;
}
.block{
  padding:1.2rem 1.4rem;
  text-align:center;
  opacity:0;
  transform:translateY(34px);
  transition:opacity .9s ease, transform .9s ease;
}
.block.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){
  .block{opacity:1;transform:none;transition:none}
}

/* переключатель языка и музыка */
.bar{
  position:fixed;top:12px;right:12px;z-index:20;
  display:flex;gap:8px;
}
.bar button{
  font-family:var(--hand);font-size:1.15rem;font-weight:700;
  border:2px solid var(--pink-deep);color:var(--pink-deep);
  background:rgba(253,251,252,.92);
  padding:.1rem .8rem;border-radius:999px;cursor:pointer;
  backdrop-filter:blur(4px);
}
.bar button.on{background:var(--pink-deep);color:#fff}
.bar button:focus-visible,.cta:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

/* гирлянда и заголовок */
.hero{padding-top:0}
.garland{display:block;width:100%;height:auto}
.hero h1{
  font-size:4.6rem;font-weight:700;line-height:.95;
  color:var(--pink-deep);margin-top:-.4rem;
}
.hero .sub{font-size:2.1rem;color:var(--pink);font-weight:600}

/* поляроид */
.polaroid{
  position:relative;
  background:#fff;
  padding:.8rem .8rem 2.6rem;
  box-shadow:0 1px 3px rgba(0,0,0,.18), 0 10px 22px rgba(120,60,90,.16);
  width:min(100%,380px);
  margin:0 auto;
  transform:rotate(var(--rot,-2deg));
}
.polaroid .frame{
  position:relative;aspect-ratio:4/4.4;background:var(--pink-pale);overflow:hidden;
}
.polaroid.wide .frame{aspect-ratio:4/3}
.polaroid.cut{background:none;box-shadow:none;padding:0}
.polaroid.cut .frame{background:none;aspect-ratio:3/4.4}
.ph{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:.3rem;
  color:var(--pink-deep);font-size:1.15rem;padding:1rem;
  border:2px dashed var(--pink);
  background:repeating-linear-gradient(45deg,var(--pink-pale),var(--pink-pale) 12px,#fff2f8 12px,#fff2f8 24px);
}
.ph b{font-size:1.5rem}
.ph code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem;background:#fff;padding:.1rem .5rem;border-radius:6px;color:var(--ink)}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cut .frame img{object-fit:contain}
.polaroid figcaption{
  position:absolute;left:0;right:0;bottom:.55rem;
  font-size:1.35rem;color:var(--pink-deep);
}

/* скетчи */
.sketch{width:100%;height:auto;display:block}
.sketch *{vector-effect:non-scaling-stroke}

/* розовая плашка с текстом */
.pill{
  background:var(--pink-soft);
  border-radius:44px;
  padding:1.6rem 1.5rem 1.8rem;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.5);
}
.pill h2{font-size:2.4rem;color:#fff;text-shadow:0 1px 0 rgba(201,86,143,.35);margin-bottom:.4rem;font-weight:700}
.pill p{color:#fff;font-size:1.5rem;text-shadow:0 1px 2px rgba(150,50,100,.35);font-weight:600}

h3.title{font-size:2.3rem;color:var(--pink-deep);font-weight:700;margin-bottom:.8rem}
.note{font-size:1.45rem;margin-top:1rem}
.place-name{font-size:2.8rem;font-weight:700;color:var(--ink);margin:.4rem 0 .2rem}

/* рваный край */
.torn{
  height:44px;background:var(--paper);margin:.5rem 0 0;
  filter:drop-shadow(0 -3px 2px rgba(0,0,0,.18));
}

/* календарь */
.calendar{
  background:var(--pink-soft);
  border-radius:40px;
  padding:1.2rem 1rem 1.4rem;
}
.calendar h3{font-size:2.2rem;color:#fff;font-weight:700;text-shadow:0 1px 2px rgba(150,50,100,.35)}
.cal-grid{
  display:grid;grid-template-columns:repeat(7,1fr);
  gap:2px;margin-top:.6rem;
  background:rgba(255,255,255,.75);border-radius:18px;padding:.6rem .4rem;
}
.cal-grid span{padding:.15rem 0;font-size:1.3rem;color:#6b5560}
.cal-grid .dow{font-weight:700;color:var(--pink-deep);font-size:1.15rem}
.cal-grid .mark{
  position:relative;color:#fff;font-weight:700;font-size:1.6rem;
  background:var(--pink-deep);border-radius:50%;
  aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 4px rgba(201,86,143,.25);
  animation:beat 1.8s ease-in-out infinite;
}
@keyframes beat{50%{transform:scale(1.12)}}
@media (prefers-reduced-motion:reduce){.cal-grid .mark{animation:none}}
.when{font-size:2.2rem;font-weight:700;color:var(--ink);margin-top:1rem}

/* кнопка */
.cta{
  display:inline-block;margin-top:1rem;
  font-family:var(--hand);font-size:1.8rem;font-weight:700;
  background:var(--pink-deep);color:#fff;text-decoration:none;
  padding:.5rem 2rem;border-radius:999px;
  box-shadow:0 6px 0 #9c3c6d;
  transition:transform .15s, box-shadow .15s;
}
.cta:hover{transform:translateY(3px);box-shadow:0 3px 0 #9c3c6d}
.cta:active{transform:translateY(6px);box-shadow:0 0 0 #9c3c6d}

.sign{font-size:1.5rem;color:var(--ink);font-weight:700;margin-top:1.4rem;line-height:1.2}
.sign a{color:inherit}
.hearts{position:fixed;inset:0;pointer-events:none;z-index:15;overflow:hidden}
.heart{position:absolute;bottom:-40px;color:var(--pink);animation:up linear forwards}
@keyframes up{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
</style>
</head>

    rsvp_msg:"Сәлем, Ажар! Мен сенің туған күніңе 22 наурызда сағат 18:00-де келемін 🎂",
    together:"Кездескенше!",
    music_on:"♪ Музыка", music_off:"❚❚ Музыка",
    dow:["Дс","Сс","Ср","Бс","Жм","Сб","Жс"], title:"Ажар · 18 · Шақыру"
  }
};

let lang = "ru";

/* ====== ЯЗЫК ====== */
function setLang(l){
  lang = l;
  const d = T[l];
  document.documentElement.lang = l === "kk" ? "kk" : "ru";
  document.title = d.title;
  document.querySelectorAll("[data-i]").forEach(el=>{
    const k = el.dataset.i;
    if (k === "music_on") { el.textContent = playing ? d.music_off : d.music_on; return; }
    if (d[k] !== undefined) el.textContent = d[k];
  });
  document.getElementById("invite-text").textContent = d.invite[(CONFIG.textVariant-1)%3];
  document.getElementById("wa").href =
    "https://wa.me/" + CONFIG.phone + "?text=" + encodeURIComponent(d.rsvp_msg);
  document.getElementById("lang-ru").classList.toggle("on", l==="ru");
  document.getElementById("lang-kk").classList.toggle("on", l==="kk");
  buildCalendar();
  try{ localStorage.setItem("lang", l); }catch(e){}
}
document.getElementById("lang-ru").onclick = ()=>setLang("ru");
document.getElementById("lang-kk").onclick = ()=>setLang("kk");

/* ====== КАЛЕНДАРЬ ====== */
function buildCalendar(){
  const box = document.getElementById("cal");
  box.innerHTML = "";
  T[lang].dow.forEach(n=>{
    const s = document.createElement("span"); s.className="dow"; s.textContent=n; box.appendChild(s);
  });
  const first = new Date(CONFIG.year, CONFIG.month-1, 1);
  const offset = (first.getDay()+6)%7;                       // неделя с понедельника
  const days = new Date(CONFIG.year, CONFIG.month, 0).getDate();
  for(let i=0;i<offset;i++) box.appendChild(document.createElement("span"));
  for(let d=1; d<=days; d++){
    const s = document.createElement("span");
    s.textContent = d;
    if(d===CONFIG.day) s.className="mark";
    box.appendChild(s);
  }
}

/* ====== АДРЕС И ПОДПИСЬ ====== */
const addr = document.getElementById("address");
if(CONFIG.address) addr.textContent = CONFIG.address; else addr.remove();
const by = document.getElementById("design-by");
if(CONFIG.designByLink){
  const a = document.createElement("a");
  a.href = CONFIG.designByLink; a.target="_blank"; a.rel="noopener"; a.textContent = CONFIG.designBy;
  by.appendChild(a);
} else by.textContent = CONFIG.designBy;

/* ====== РВАНЫЙ КРАЙ ====== */
(function(){
  const pts=["0% 100%","0% 40%"];
  for(let i=1;i<40;i++){ pts.push((i*2.5)+"% "+(10+Math.round(Math.random()*40))+"%"); }
  pts.push("100% 40%","100% 100%");
  document.querySelector(".torn").style.clipPath = "polygon("+pts.join(",")+")";
})();

/* ====== ПОЯВЛЕНИЕ БЛОКОВ ПО ОДНОМУ ====== */
const io = new IntersectionObserver((entries)=>{
  entries.forEach(e=>{
    if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); }
  });
},{threshold:.25});
document.querySelectorAll(".block").forEach(b=>io.observe(b));
// первый блок появляется сразу при открытии
window.addEventListener("load",()=>{
  const first = document.querySelector(".block");
  setTimeout(()=>first.classList.add("in"),150);
});

/* ====== МУЗЫКА: файл birthday.mp3 (лежит рядом с index.html) ====== */
const audio = new Audio("birthday.mp3");
audio.loop = true;
audio.preload = "auto";
let playing = false;
function updateMusicBtn(){
  const b = document.getElementById("music");
  b.setAttribute("aria-pressed", playing);
  b.textContent = playing ? T[lang].music_off : T[lang].music_on;
}
document.getElementById("music").onclick = function(){
  if(!playing){
    audio.play().then(()=>{ playing = true; updateMusicBtn(); confetti(); }).catch(()=>{});
  } else {
    audio.pause(); playing = false; updateMusicBtn();
  }
};

/* ====== СЕРДЕЧКИ ПРИ ВКЛЮЧЕНИИ МУЗЫКИ ====== */
function confetti(){
  if(matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  const box = document.getElementById("hearts");
  for(let i=0;i<22;i++){
    const h = document.createElement("span");
    h.className="heart"; h.textContent = ["♥","✦","♡"][i%3];
    h.style.left = Math.random()*100+"vw";
    h.style.fontSize = (16+Math.random()*26)+"px";
    h.style.animationDuration = (3+Math.random()*3)+"s";
    h.style.animationDelay = (Math.random()*1.2)+"s";
    box.appendChild(h);
    setTimeout(()=>h.remove(),7000);
  }
}

/* ====== СТАРТ ====== */
let saved = "ru";
try{ saved = localStorage.getItem("lang") || "ru"; }catch(e){}
setLang(saved === "kk" ? "kk" : "ru");
</script>
</body>
</html>
